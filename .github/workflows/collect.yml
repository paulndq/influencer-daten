name: Daten sammeln
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python collect.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Daten committen
        run: |
          git config user.name "daten-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Daten $(date -u +%F)"
          git push
