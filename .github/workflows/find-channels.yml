name: Kanäle finden
on:
  workflow_dispatch:
    inputs:
      add_per_region:
        description: "Wie viele Kanäle pro Region direkt in channels.json eintragen (0 = nur Vorschläge)"
        default: "0"
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python find_channels.py --add "${{ inputs.add_per_region }}"
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Ergebnis committen
        run: |
          git config user.name "daten-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data channels.json
          git diff --staged --quiet || git commit -m "Kanalvorschläge $(date -u +%F)"
          git push
